<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Air Ticket Tanzania-Book Flight</title>
        <meta name="description" content="Official website developed by Mr Fredy samson mussa a student at Mzumbe university">
        <meta name="author" content="Mr Fredy samson mussa">
        <meta name="robots" content="index, follow">

        <link rel="stylesheet" href="../CSS/booking.css">
        <link rel="icon" type="image/jpeg" href="../IMAGES/AirTz-logo.jpeg">
    </head>
    <body>
        <header>
            <div class="logo">
                <div><img src="../IMAGES/AirTz-logo.jpeg" width="60px" height="60px"></div>
                <div class="logo-name">Air Ticket Tanzania</div>
            </div>
            <nav class="navigation-links">
                <a href="../index.html">Back Home</a>
                <a href="dashboard.html">My Bookings</a>
            </nav>
        </header>

        <!--BOOK NOW -->
        <section class="book-section">
            <h1>Complete Your Booking</h1>
        </section>

        <section class="form-section">
            <h2>Air Ticket Booking</h2>
            <div class="result" id="flightInfo">
                <!--Display flight result Here-->
            </div>
            
            <!--Seat html Code-->
            <h3>Select Your Seat</h3>
            <div id="seatMap"></div>
            <p id="selectedSeat">No seat selected</p>
            
            <div class="combined-input-section">
                <div class="input-section1">
                    <div><input type="text" id="name" placeholder="Full Name" required></div>
                    <div><input type="text" id="phone" placeholder="Phone Number" required></div>
                </div>
                <div class="input-section2">
                    <div><input type="email" id="email" placeholder="Email" required></div>
                    <div><button id="btn">confirm Booking</button></div>
                </div>
            </div>
        </section>
        <!--LINKING EXTERNAL JAVASCRIPT FILE-->
        <script  src="../JS/booking.js"></script>

        <!--FOOTER-->
        <footer>
            <p>Copyright &copy; 2026 Air Tanzania. All rights reserved</p>
        </footer>
    </body>
</html>
